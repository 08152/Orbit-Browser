<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orbit Web Network</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
}

#bar{
  padding:10px;
  background:#0a0a0a;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

input, textarea{
  background:#111;
  border:1px solid #333;
  color:white;
  padding:6px;
}

textarea{
  width:300px;
  height:80px;
}

button{
  background:#222;
  border:1px solid #444;
  color:white;
  padding:6px;
  cursor:pointer;
}

#view{
  padding:20px;
}
</style>
</head>

<body>

<div id="bar">
  <input id="creator" placeholder="creator">
</div>

<div id="bar">
  <input id="open" placeholder="seite.orbit">
  <button onclick="loadPage()">Open</button>
</div>

<div id="bar">
  <input id="pname" placeholder="seite.orbit">
  <textarea id="content" placeholder="HTML"></textarea>
  <button onclick="upload()">Upload</button>
</div>

<div id="bar">
  <button onclick="explore()">Explore</button>
</div>

<div id="view">Orbit Web Network gestartet</div>

<script>
async function loadPage(){
  let name = document.getElementById("open").value;

  let res = await fetch("/page/" + name);
  let data = await res.json();

  document.getElementById("view").innerHTML =
    data.content;
}

async function upload(){
  let name = document.getElementById("pname").value;
  let content = document.getElementById("content").value;
  let creator = document.getElementById("creator").value;

  let res = await fetch("/upload", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      name,
      content,
      creator
    })
  });

  let data = await res.json();

  document.getElementById("view").innerText =
    data.success ? "Seite gespeichert" : data.error;
}

async function explore(){
  let res = await fetch("/explore");
  let data = await res.json();

  let html = "<h2>Orbit Network</h2>";

  data.forEach(p => {
    html += "<p>" + p.name +
      " (" + p.creator + ")</p>";
  });

  document.getElementById("view").innerHTML = html;
}
</script>

</body>
</html>
