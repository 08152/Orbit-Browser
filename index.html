<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mini Minecraft 3D</title>
<style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;

init();
animate();

function createGrassTexture() {
    const c = document.createElement("canvas");
    c.width = 128;
    c.height = 128;
    const ctx = c.getContext("2d");

    // Grundfarbe Gras
    ctx.fillStyle = "#3cb043";
    ctx.fillRect(0, 0, 128, 128);

    // kleine "Grasflecken"
    for (let i = 0; i < 1500; i++) {
        const shade = 80 + Math.random() * 80;
        ctx.fillStyle = `rgb(0,${shade},0)`;
        ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
    }

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, 1);

    return tex;
}

function init() {

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // 🌤️ Himmel

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Licht
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    // 🌿 Textur (garantiert sichtbar)
    const texture = createGrassTexture();

    const material = new THREE.MeshLambertMaterial({ map: texture });
    const geometry = new THREE.BoxGeometry(1, 1, 1);

    // 🧱 Welt
    for (let x = -15; x < 15; x++) {
        for (let z = -15; z < 15; z++) {
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, 0, z);
            scene.add(cube);
        }
    }

    camera.position.set(0, 8, 15);

    document.addEventListener("keydown", move);
}

function move(e) {
    const s = 0.6;

    if (e.key === "w") camera.position.z -= s;
    if (e.key === "s") camera.position.z += s;
    if (e.key === "a") camera.position.x -= s;
    if (e.key === "d") camera.position.x += s;
    if (e.key === " ") camera.position.y += s;
    if (e.key === "Shift") camera.position.y -= s;
}

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
</script>

</body>
</html>
