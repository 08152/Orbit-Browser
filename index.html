<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orbit Browser</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
}

/* TITLE */
h1{
  text-align:center;
  font-size:60px;
  margin-top:20px;
}

/* CENTER BOX */
#box{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:20px;
}

input, textarea{
  background:#111;
  border:1px solid #333;
  color:white;
  padding:10px;
  margin:5px;
  width:300px;
}

button{
  padding:10px 15px;
  background:#1e1e1e;
  border:1px solid #444;
  color:white;
  cursor:pointer;
  margin:5px;
}

button:hover{
  background:#333;
}

/* COINS */
#coinsBox{
  position:fixed;
  top:10px;
  right:10px;
  background:#111;
  padding:10px;
  border:1px solid #333;
  border-radius:8px;
}

/* COIN PANEL */
#coinPanel{
  position:fixed;
  top:120px;
  right:10px;
  background:#111;
  padding:10px;
  border:1px solid #333;
  display:none;
}

/* BACK BUTTON */
#backBtn{
  position:fixed;
  bottom:10px;
  left:10px;
}

#view{
  text-align:center;
  margin-top:30px;
}
</style>
</head>

<body>

<h1>Orbit</h1>

<!-- COINS -->
<div id="coinsBox">
  Coins: <span id="coins">5</span><br>
  <button onclick="toggleCoin()">Coin</button>
</div>

<!-- COIN PANEL -->
<div id="coinPanel">
  <input id="code" placeholder="Code">
  <input id="amount" type="number" placeholder="Coins">

  <button onclick="addCoins()">OK</button>
  <button onclick="toggleCoin()">Zurück</button>
</div>

<button id="backBtn" onclick="back()">Back</button>

<div id="box">

  <!-- PAGE OPEN -->
  <input id="open" placeholder="seite.orbit / new_page.orbit">
  <button onclick="openPage()">Open</button>

  <!-- HOSTING -->
  <input id="creator" placeholder="creator">

  <input id="pname" placeholder="page.orbit">
  <textarea id="content" placeholder="HTML"></textarea>

  <button onclick="upload()">Hosting</button>
  <button onclick="explore()">Explorer</button>

</div>

<div id="view">Orbit Ready</div>

<script>

/* DATA */
let pages = JSON.parse(localStorage.getItem("orbit_pages") || "[]");
let coins = Number(localStorage.getItem("orbit_coins") || 5);

let history = [];

/* COINS */
function updateCoins(){
  document.getElementById("coins").innerText = coins;
  localStorage.setItem("orbit_coins", coins);
}

/* COIN PANEL */
function toggleCoin(){
  let p = document.getElementById("coinPanel");
  p.style.display = (p.style.display === "block") ? "none" : "block";
}

/* ADD COINS */
async function addCoins(){

  let code = document.getElementById("code").value;
  let amount = Number(document.getElementById("amount").value);

  let res = await fetch("/addcoins", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ code, amount })
  });

  let data = await res.json();

  if(data.success){
    coins += amount;
    updateCoins();
  }
}

/* BACK */
function back(){
  if(history.length <= 1) return;

  history.pop();
  document.getElementById("view").innerHTML =
    history[history.length - 1];
}

/* OPEN PAGE */
async function openPage(){

  let name = document.getElementById("open").value;

  /* ❌ REMOVED: neue_.orbit */

  /* NEW PAGE ROUTE */
  if(name === "new_page.orbit"){
    document.getElementById("view").innerHTML =
      "<h2>Neue Seite erstellen</h2>";
    return;
  }

  let local = pages.find(p => p.name === name);

  if(local){
    history.push(local.content);
    document.getElementById("view").innerHTML = local.content;
    return;
  }

  let res = await fetch("/page/" + name);
  let data = await res.json();

  history.push(data.content);
  document.getElementById("view").innerHTML = data.content;
}

/* UPLOAD */
async function upload(){

  let name = document.getElementById("pname").value;
  let content = document.getElementById("content").value;
  let creator = document.getElementById("creator").value;

  pages.push({name, content, creator});
  localStorage.setItem("orbit_pages", JSON.stringify(pages));

  await fetch("/upload", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ name, content, creator })
  });

  document.getElementById("view").innerText =
    "SAVED";
}

/* EXPLORE */
async function explore(){

  let res = await fetch("/allpages");
  let data = await res.json();

  let html = "<h2>Explorer</h2>";

  data.forEach(p=>{
    html += `<p>${p.name}</p>`;
  });

  document.getElementById("view").innerHTML = html;
}

/* INIT */
updateCoins();

</script>

</body>
</html>
