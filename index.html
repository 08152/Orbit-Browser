<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Minecraft FPS World</title>
<style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: sans-serif;
        background: rgba(0,0,0,0.4);
        padding: 8px;
    }
</style>
</head>
<body>

<div id="info">Klick: Maus aktiv | WASD bewegen | Space springen</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;

let velocityY = 0;
let canJump = false;

const keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

init();
animate();

/* =========================
   SIMPLE NOISE (HÜGEL)
========================= */
function noise(x, z) {
    return Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2
         + Math.sin(x * 0.05 + z * 0.05) * 4;
}

/* =========================
   GRAS TEXTUR
========================= */
function grassTexture() {
    const c = document.createElement("canvas");
    c.width = 64;
    c.height = 64;
    const ctx = c.getContext("2d");

    ctx.fillStyle = "#3cb043";
    ctx.fillRect(0,0,64,64);

    for (let i=0;i<400;i++) {
        ctx.fillStyle = `rgb(0,${100+Math.random()*100},0)`;
        ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
    }

    return new THREE.CanvasTexture(c);
}

function init() {

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer();
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);

    const tex = grassTexture();
    const mat = new THREE.MeshLambertMaterial({ map: tex });
    const geo = new THREE.BoxGeometry(1,1,1);

    /* =========================
       🌄 ZUFALLSWELT MIT HÜGELN
    ========================= */
    for (let x = -25; x < 25; x++) {
        for (let z = -25; z < 25; z++) {

            let h = Math.floor(noise(x, z));

            for (let y = -3; y <= h; y++) {
                const cube = new THREE.Mesh(geo, mat);
                cube.position.set(x, y, z);
                scene.add(cube);
            }
        }
    }

    camera.position.set(0, 5, 5);

    /* MOUSE LOCK */
    document.body.addEventListener("click", () => {
        document.body.requestPointerLock();
    });

    document.addEventListener("mousemove", mouseMove);

    window.addEventListener("resize", () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
}

/* =========================
   MOUSE LOOK
========================= */
let rotX = 0;
let rotY = 0;

function mouseMove(e) {
    if (document.pointerLockElement !== document.body) return;

    rotY -= e.movementX * 0.002;
    rotX -= e.movementY * 0.002;

    rotX = Math.max(-1.5, Math.min(1.5, rotX));
}

/* =========================
   GAME LOOP
========================= */
function animate() {
    requestAnimationFrame(animate);

    camera.rotation.x = rotX;
    camera.rotation.y = rotY;

    let speed = 0.15;

    let forward = new THREE.Vector3(
        Math.sin(rotY),
        0,
        Math.cos(rotY)
    );

    let right = new THREE.Vector3(
        Math.sin(rotY + Math.PI/2),
        0,
        Math.cos(rotY + Math.PI/2)
    );

    if (keys["w"]) camera.position.addScaledVector(forward, -speed);
    if (keys["s"]) camera.position.addScaledVector(forward, speed);
    if (keys["a"]) camera.position.addScaledVector(right, -speed);
    if (keys["d"]) camera.position.addScaledVector(right, speed);

    // Gravity
    velocityY -= 0.01;
    camera.position.y += velocityY;

    if (camera.position.y < 5) {
        camera.position.y = 5;
        velocityY = 0;
        canJump = true;
    }

    if (keys[" "] && canJump) {
        velocityY = 0.25;
        canJump = false;
    }

    renderer.render(scene, camera);
}
</script>

</body>
</html>
