<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orbit Browser</title>

<style>
body{
  margin:0;
  background:#0a0a0a;
  color:white;
  font-family:Arial;
}

/* TOP BAR */
#top{
  display:flex;
  gap:8px;
  padding:8px;
  background:#111;
  border-bottom:1px solid #222;
  align-items:center;
}

/* URL INPUT */
#url{
  flex:1;
  padding:8px;
  background:#1a1a1a;
  border:1px solid #333;
  color:white;
  border-radius:6px;
}

/* BUTTONS */
button{
  background:#1b1b1b;
  border:1px solid #333;
  color:white;
  padding:6px 10px;
  cursor:pointer;
}
button:hover{
  background:#2a2a2a;
}

/* VIEW */
#view{
  padding:20px;
  min-height:85vh;
}

/* COINS */
#coins{
  position:fixed;
  top:10px;
  right:10px;
  background:#111;
  padding:10px 12px;
  border:1px solid #333;
  border-radius:8px;
}

/* BACK */
#back{
  position:fixed;
  bottom:10px;
  left:10px;
}
</style>
</head>

<body>

<!-- COINS -->
<div id="coins">
Coins: <span id="c">0</span>
</div>

<!-- BACK -->
<button id="back" onclick="back()">← Back</button>

<!-- TOP -->
<div id="top">
  <input id="url" placeholder="page.orbit / new_page.orbit" onkeydown="go(event)">
  <button onclick="redeemCoins()">Coins +</button>
</div>

<!-- VIEW -->
<div id="view">Orbit Ready</div>

<script>

let coins = Number(localStorage.getItem("coins") || 0);
let pages = JSON.parse(localStorage.getItem("pages") || "[]");

/* OFFLINE QUEUE */
let queue = JSON.parse(localStorage.getItem("queue") || JSON.stringify({
  pages: [],
  coins: 0
}));

let history = [];

document.getElementById("c").innerText = coins;

/* =========================
   SAVE LOCAL
========================= */
function saveLocal(){
  localStorage.setItem("coins", coins);
  localStorage.setItem("pages", JSON.stringify(pages));
  localStorage.setItem("queue", JSON.stringify(queue));
}

/* =========================
   SYNC SYSTEM
========================= */
async function sync(){

  try{

    // LOAD SERVER COINS
    let res = await fetch("/coins");
    let data = await res.json();

    if(data.coins !== undefined){
      coins = data.coins;
    }

    // UPLOAD OFFLINE COINS
    if(queue.coins !== 0){
      await fetch("/coins/sync", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ delta: queue.coins })
      });

      queue.coins = 0;
    }

    // UPLOAD OFFLINE PAGES
    for(let p of queue.pages){
      await fetch("/page/save", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(p)
      });
    }

    queue.pages = [];

    saveLocal();

  }catch(e){
    console.log("OFFLINE MODE");
  }

  document.getElementById("c").innerText = coins;
}

/* AUTO SYNC LOOP */
setInterval(sync, 8000);
sync();

/* =========================
   BACK
========================= */
function back(){
  if(history.length <= 1) return;
  history.pop();
  openPage(history[history.length - 1], false);
}

/* =========================
   NAV
========================= */
function go(e){
  if(e.key !== "Enter") return;
  openPage(e.target.value);
}

/* =========================
   OPEN PAGE
========================= */
async function openPage(name, addHistory=true){

  if(name === "new_page.orbit"){

    document.getElementById("view").innerHTML = `
      <h2>Neue Seite erstellen</h2>

      <input id="pname" placeholder="name.orbit"><br><br>

      <textarea id="pcontent" style="width:100%;height:150px;"></textarea><br><br>

      <button onclick="createPage()">Speichern</button>
      <button onclick="back()">← Back</button>
    `;

    return;
  }

  let local = pages.find(p => p.name === name);
  let content = "";

  if(local){
    content = local.content;
  }else{
    try{
      let res = await fetch("/page/" + name);
      let data = await res.json();
      content = data.content || "404";
    }catch(e){
      content = "<h3>Offline Mode</h3>";
    }
  }

  document.getElementById("view").innerHTML = content;

  if(addHistory) history.push(name);
}

/* =========================
   CREATE PAGE
========================= */
function createPage(){

  let name = document.getElementById("pname").value;
  let content = document.getElementById("pcontent").value;

  let page = {name, content};

  pages.push(page);
  queue.pages.push(page);

  saveLocal();

  openPage(name);
}

/* =========================
   COIN PIN SYSTEM
========================= */
function redeemCoins(){

  let pin = prompt("PIN eingeben:");

  if(pin === "081508151235180Rss#"){

    let amount = Number(prompt("Coins hinzufügen:"));

    coins += amount;
    queue.coins += amount;

    saveLocal();

    document.getElementById("c").innerText = coins;

  } else {
    alert("Falscher PIN");
  }
}

</script>

</body>
</html>
