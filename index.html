<!DOCTYPE html><html lang="de">
<head>
<meta charset="UTF-8">
<title>Mini Minecraft 3D</title>
<style>
body {
    margin: 0;
    overflow: hidden;
}
canvas {
    display: block;
}
#info {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-family: sans-serif;
    background: rgba(0,0,0,0.4);
    padding: 8px;
}
</style>
</head>
<body><div id="info">Klick: Maus aktiv | WASD bewegen | Space springen</div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
let scene, camera, renderer;

let velocityY = 0;
let canJump = false;
const keys = {};

let worldBlocks = new Map();

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

init();
animate();

function init() {

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    camera = new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        1000
    );

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10,20,10);
    scene.add(light);

    window.blockTexture = new THREE.TextureLoader().load("grass.png");

    blockTexture.colorSpace = THREE.SRGBColorSpace;
    blockTexture.magFilter = THREE.NearestFilter;
    blockTexture.minFilter = THREE.NearestFilter;

    window.blockMaterial =
        new THREE.MeshLambertMaterial({
            map:blockTexture
        });

    window.blockGeometry =
        new THREE.BoxGeometry(1,1,1);

    camera.position.set(0,8,10);

    document.body.addEventListener("click", () => {
        document.body.requestPointerLock();
    });

    let rotX = 0;
    let rotY = 0;

    document.addEventListener("mousemove", (e) => {

        if(document.pointerLockElement !== document.body)
            return;

        rotY -= e.movementX * 0.002;
        rotX -= e.movementY * 0.002;

        rotX = Math.max(-1.5, Math.min(1.5, rotX));

        camera.rotation.x = rotX;
        camera.rotation.y = rotY;
    });

    window.addEventListener("resize", () => {

        camera.aspect =
            innerWidth / innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    });

    if(window.initChunks)
        window.initChunks();
}

function animate() {

    requestAnimationFrame(animate);

    if(window.updateChunks)
        updateChunks();

    renderer.render(scene,camera);
}
</script><script src="1.js"></script><script src="2.js"></script><script src="inventar.js"></script><script src="skin.js"></script><script src="verwaltung.js"></script></body>
</html>
