<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mini Minecraft 3D</title>
<style>
body {
    margin: 0;
    overflow: hidden;
}
canvas {
    display: block;
}
#info {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-family: sans-serif;
    background: rgba(0,0,0,0.4);
    padding: 8px;
}
</style>
</head>
<body>

<div id="info">Klick: Maus aktiv | WASD bewegen | Space springen</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;

let velocityY = 0;
let canJump = false;
const keys = {};

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

init();
animate();

/* =========================
   SIMPLE HILL WORLD
========================= */
function height(x, z) {
    return Math.floor(
        Math.sin(x * 0.15) * 2 +
        Math.cos(z * 0.15) * 2 +
        Math.sin((x + z) * 0.05) * 3
    );
}

function init() {

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    camera = new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        1000
    );

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // Licht
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);

    // TEXTUR LADEN
    const tex = new THREE.TextureLoader().load("grass.png");

    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;

    const mat = new THREE.MeshLambertMaterial({
        map: tex
    });

    const geo = new THREE.BoxGeometry(1,1,1);

    /* =========================
       WELT
    ========================= */
    const SIZE = 25;

    for (let x = -SIZE; x < SIZE; x++) {
        for (let z = -SIZE; z < SIZE; z++) {

            let h = height(x, z);

            if (h < 0) h = 0;
            if (h > 6) h = 6;

            for (let y = 0; y <= h; y++) {

                const cube = new THREE.Mesh(geo, mat);

                cube.position.set(
                    x,
                    y,
                    z
                );

                scene.add(cube);
            }
        }
    }

    camera.position.set(0, 8, 10);

    /* =========================
       MOUSE LOOK
    ========================= */
    document.body.addEventListener("click", () => {
        document.body.requestPointerLock();
    });

    let rotX = 0;
    let rotY = 0;

    document.addEventListener("mousemove", (e) => {

        if (document.pointerLockElement !== document.body)
            return;

        rotY -= e.movementX * 0.002;
        rotX -= e.movementY * 0.002;

        rotX = Math.max(-1.5, Math.min(1.5, rotX));

        camera.rotation.x = rotX;
        camera.rotation.y = rotY;
    });

    window.addEventListener("resize", () => {

        camera.aspect =
            innerWidth / innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    });
}

/* =========================
   GAME LOOP
========================= */
function animate() {

    requestAnimationFrame(animate);

    const speed = 0.15;

    const forward = new THREE.Vector3(
        Math.sin(camera.rotation.y),
        0,
        Math.cos(camera.rotation.y)
    );

    const right = new THREE.Vector3(
        Math.sin(camera.rotation.y + Math.PI / 2),
        0,
        Math.cos(camera.rotation.y + Math.PI / 2)
    );

    if (keys["w"])
        camera.position.addScaledVector(forward, -speed);

    if (keys["s"])
        camera.position.addScaledVector(forward, speed);

    if (keys["a"])
        camera.position.addScaledVector(right, -speed);

    if (keys["d"])
        camera.position.addScaledVector(right, speed);

    // Schwerkraft
    velocityY -= 0.01;
    camera.position.y += velocityY;

    if (camera.position.y < 8) {
        camera.position.y = 8;
        velocityY = 0;
        canJump = true;
    }

    if (keys[" "] && canJump) {
        velocityY = 0.22;
        canJump = false;
    }

    renderer.render(scene, camera);
}
</script>

</body>
</html>
