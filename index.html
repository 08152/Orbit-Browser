<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orbit Browser</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
}

/* TITLE */
h1{
  text-align:center;
  font-size:60px;
  margin-top:30px;
}

/* SEARCH */
#searchBox{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:20px;
}

input, textarea{
  background:#111;
  border:1px solid #333;
  color:white;
  padding:10px;
  margin:5px;
  width:300px;
}

/* BUTTON */
button{
  padding:10px 20px;
  background:#1e1e1e;
  border:1px solid #444;
  color:white;
  cursor:pointer;
  margin:5px;
}

button:hover{
  background:#333;
}

/* COINS BOX */
#coinsBox{
  position:fixed;
  top:10px;
  right:10px;
  background:#111;
  padding:10px;
  border:1px solid #333;
  border-radius:8px;
  text-align:center;
}

/* COIN PANEL */
#coinPanel{
  position:fixed;
  top:120px;
  right:10px;
  background:#111;
  padding:10px;
  border:1px solid #333;
  display:none;
}

/* VIEW */
#view{
  text-align:center;
  margin-top:30px;
}
</style>
</head>

<body>

<h1>Orbit</h1>

<!-- COINS -->
<div id="coinsBox">
  Coins: <span id="coins">5</span><br>
  <button onclick="toggleCoin()">Coin</button>
</div>

<!-- COIN PANEL -->
<div id="coinPanel">
  <input id="code" placeholder="Code">
  <input id="amount" type="number" placeholder="Coins">
  <button onclick="addCoins()">OK</button>
</div>

<!-- SEARCH / HOSTING -->
<div id="searchBox">

  <input id="open" placeholder="name.orbit">
  <button onclick="openPage()">Open</button>

  <input id="creator" placeholder="creator">

  <input id="pname" placeholder="page.orbit">
  <textarea id="content" placeholder="HTML"></textarea>

  <button onclick="upload()">Hosting</button>

  <button onclick="explore()">Explorer</button>

</div>

<div id="view">Orbit System Ready</div>

<script>

let coinOpen = false;

// LOAD COINS
async function loadCoins(){
  let res = await fetch("/coins");
  let data = await res.json();
  document.getElementById("coins").innerText = data.coins;
}

// TOGGLE PANEL
function toggleCoin(){
  coinOpen = !coinOpen;
  document.getElementById("coinPanel").style.display =
    coinOpen ? "block" : "none";
}

// ADD COINS
async function addCoins(){
  let code = document.getElementById("code").value;
  let amount = Number(document.getElementById("amount").value);

  let res = await fetch("/addcoins", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ code, amount })
  });

  let data = await res.json();

  if(data.success){
    alert("Coins added");
    loadCoins();
  } else {
    alert(data.error);
  }
}

// OPEN PAGE
async function openPage(){
  let name = document.getElementById("open").value;

  let res = await fetch("/page/" + name);
  let data = await res.json();

  document.getElementById("view").innerHTML = data.content;
}

// UPLOAD PAGE
async function upload(){
  let name = document.getElementById("pname").value;
  let content = document.getElementById("content").value;
  let creator = document.getElementById("creator").value;

  let res = await fetch("/upload", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ name, content, creator })
  });

  let data = await res.json();

  document.getElementById("view").innerText =
    data.success ? "UPLOADED" : data.error;
}

// EXPLORE
async function explore(){
  let res = await fetch("/explore");
  let data = await res.json();

  let html = "<h2>Orbit Explorer</h2>";

  data.forEach(p=>{
    html += "<p>" + p.name + " (" + p.creator + ")</p>";
  });

  document.getElementById("view").innerHTML = html;
}

// INIT
loadCoins();

</script>

</body>
</html>
