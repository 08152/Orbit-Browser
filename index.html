<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orbit Browser</title>

<style>
body{
  margin:0;
  background:#0a0a0a;
  color:white;
  font-family:Arial;
}

/* TOP BAR (realistischer) */
#top{
  display:flex;
  gap:8px;
  padding:8px;
  background:#111;
  border-bottom:1px solid #222;
  align-items:center;
}

/* URL BAR */
#url{
  flex:1;
  padding:8px;
  background:#1a1a1a;
  border:1px solid #333;
  color:white;
  border-radius:6px;
  outline:none;
}

/* VIEW */
#view{
  padding:20px;
  min-height:90vh;
}

/* COINS PANEL */
#coins{
  position:fixed;
  top:10px;
  right:10px;
  background:#111;
  padding:10px 12px;
  border:1px solid #333;
  border-radius:8px;
  font-size:13px;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
}

/* LOADING FEEL */
.loading{
  opacity:0.6;
}
</style>
</head>

<body>

<!-- COINS -->
<div id="coins">
Coins: <span id="c">0</span>
</div>

<!-- TOP BAR -->
<div id="top">
  <input id="url" placeholder="page.orbit" onkeydown="go(event)">
</div>

<!-- VIEW -->
<div id="view">Orbit Loading...</div>

<script>

let coins = Number(localStorage.getItem("coins") || 0);
let pages = JSON.parse(localStorage.getItem("pages") || "[]");

document.getElementById("c").innerText = coins;

/* =========================
   SYNC COINS (SERVER → LOCAL)
========================= */
async function sync(){

  try{
    let res = await fetch("/coins");
    let data = await res.json();

    if(data && data.coins !== undefined){
      coins = data.coins;
      localStorage.setItem("coins", coins);
      document.getElementById("c").innerText = coins;
    }

  }catch(e){
    console.log("offline mode");
  }
}

sync();

/* =========================
   LOCAL SAVE
========================= */
function saveLocal(){
  localStorage.setItem("pages", JSON.stringify(pages));
}

/* =========================
   OPEN PAGE
========================= */
async function openPage(name){

  document.getElementById("view").innerHTML =
    "<div class='loading'>Loading...</div>";

  // LOCAL FIRST
  let local = pages.find(p => p.name === name);

  if(local){
    document.getElementById("view").innerHTML = local.content;
    return;
  }

  // SERVER FALLBACK
  try{
    let res = await fetch("/page/" + name);
    let data = await res.json();

    document.getElementById("view").innerHTML =
      data.content || "<h3>404</h3>";

  }catch(e){
    document.getElementById("view").innerHTML =
      "<h3>Offline - local only</h3>";
  }
}

/* =========================
   SAVE PAGE (LOCAL + SERVER)
========================= */
async function savePage(name, content){

  pages.push({name, content});
  saveLocal();

  try{
    await fetch("/page/save", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name, content})
    });
  }catch(e){
    console.log("saved locally only");
  }
}

/* =========================
   URL INPUT
========================= */
function go(e){
  if(e.key !== "Enter") return;
  openPage(e.target.value);
}

</script>

</body>
</html>
