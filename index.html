<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orbit Browser</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:white;
}

/* ===== TOP BAR (Browser chrome) ===== */
#topbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  background:#111;
  border-bottom:1px solid #222;
}

/* TABS */
#tabs{
  display:flex;
  gap:6px;
}

.tab{
  background:#1c1c1c;
  padding:6px 10px;
  border-radius:6px;
  font-size:12px;
  cursor:pointer;
}

/* URL BAR */
#url{
  flex:1;
  padding:8px;
  background:#1a1a1a;
  border:1px solid #333;
  color:white;
  border-radius:6px;
}

/* VIEWPORT */
#view{
  height:calc(100vh - 45px);
  overflow:auto;
  padding:20px;
  background:#000;
}

/* REALISTIC LOADING LOOK */
.placeholder{
  color:#666;
  font-size:14px;
}
</style>
</head>

<body>

<!-- BROWSER TOP -->
<div id="topbar">

  <div id="tabs"></div>

  <input id="url" placeholder="search or enter .orbit" onkeydown="go(event)">

</div>

<!-- VIEW -->
<div id="view">
  <div class="placeholder">Orbit Browser ready</div>
</div>

<script>

/* DATA */
let pages = JSON.parse(localStorage.getItem("orbit_pages") || "[]");
let tabs = [];

/* NAV */
function go(e){
  if(e.key !== "Enter") return;

  let url = document.getElementById("url").value;
  openPage(url);
}

/* OPEN PAGE */
function openPage(name){

  let page = pages.find(p => p.name === name);

  if(!page){

    document.getElementById("view").innerHTML =
      `<div class="placeholder">404 - page not found</div>`;

    addTab(name);
    return;
  }

  /* REAL BROWSER VIEW */
  document.getElementById("view").innerHTML = `
    <div style="color:#777;font-size:12px;margin-bottom:10px;">
      Loaded: ${name}
    </div>
    ${page.content}
  `;

  addTab(name);
}

/* TABS */
function addTab(name){

  tabs.push(name);
  renderTabs();
}

function renderTabs(){

  document.getElementById("tabs").innerHTML =
    tabs.map((t,i)=>`
      <div class="tab" onclick="switchTab(${i})">
        ${t}
      </div>
    `).join("");
}

/* SWITCH TAB */
function switchTab(i){
  openPage(tabs[i]);
}

</script>

</body>
</html>
