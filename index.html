<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orbit File Browser</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
}

#top{
  display:flex;
  gap:8px;
  padding:8px;
  background:#111;
}

input, button, textarea{
  background:#1a1a1a;
  color:white;
  border:1px solid #333;
  padding:8px;
}

#view{
  padding:20px;
}

.file{
  margin:10px 0;
  padding:10px;
  border:1px solid #333;
}
</style>
</head>

<body>

<div id="top">
<input id="name" placeholder="page.orbit">
<button onclick="loadPage()">Load</button>
<button onclick="savePage()">Save Page</button>
</div>

<div id="view">Orbit File System Ready</div>

<h3>Upload File</h3>
<input type="file" id="file">
<button onclick="uploadFile()">Upload</button>

<script>

let currentPage = "";

/* LOAD PAGE */
async function loadPage(){

  let name = document.getElementById("name").value;
  currentPage = name;

  let res = await fetch("/page/" + name);
  let data = await res.json();

  let html = `<h2>${name}</h2>`;

  if(data.content){
    html += `<div>${data.content}</div>`;
  }

  html += `<h3>Files</h3>`;

  (data.files || []).forEach(f=>{

    let url = "/" + f.filename;

    if(f.type.startsWith("image")){
      html += `<img src="${url}" width="200"><br>`;
    }

    else if(f.type.startsWith("video")){
      html += `<video src="${url}" controls width="300"></video><br>`;
    }

    else if(f.type.startsWith("audio")){
      html += `<audio src="${url}" controls></audio><br>`;
    }

    else{
      html += `<a href="${url}" target="_blank">${f.filename}</a><br>`;
    }

  });

  document.getElementById("view").innerHTML = html;
}

/* SAVE PAGE */
async function savePage(){

  let name = document.getElementById("name").value;

  await fetch("/page/save", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name,
      content:""
    })
  });

  alert("saved");
}

/* UPLOAD FILE */
async function uploadFile(){

  let file = document.getElementById("file").files[0];

  let form = new FormData();
  form.append("file", file);
  form.append("page", currentPage);

  await fetch("/upload", {
    method:"POST",
    body:form
  });

  alert("uploaded");
}

</script>

</body>
</html>
