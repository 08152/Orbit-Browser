<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Orbit Browser</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial;
}

/* TOP */
#top{
  display:flex;
  gap:6px;
  padding:8px;
  background:#111;
}

#url{
  flex:1;
  padding:8px;
  background:#1a1a1a;
  border:1px solid #333;
  color:white;
}

/* BUTTONS */
button{
  background:#1a1a1a;
  border:1px solid #333;
  color:white;
  padding:6px 10px;
  cursor:pointer;
}

/* VIEW */
#view{
  padding:18px;
  min-height:80vh;
}

/* COINS */
#coins{
  position:fixed;
  top:10px;
  right:10px;
  background:#111;
  padding:10px;
  border:1px solid #333;
}

/* BACK */
#back{
  position:fixed;
  bottom:10px;
  left:10px;
}
</style>
</head>

<body>

<div id="coins">Coins: <span id="c">0</span></div>
<button id="back" onclick="back()">← Back</button>

<div id="top">
  <input id="url" placeholder="page.orbit / new_page.orbit" onkeydown="go(event)">
  <button onclick="coinPin()">Coin+</button>
</div>

<div id="view">Orbit Ready</div>

<script>

let coins = Number(localStorage.getItem("coins") || 0);
let pages = JSON.parse(localStorage.getItem("pages") || "[]");

let queue = JSON.parse(localStorage.getItem("queue") || JSON.stringify({
  coins:0,
  pages:[]
}));

let history = [];

document.getElementById("c").innerText = coins;

/* SAVE */
function save(){
  localStorage.setItem("coins", coins);
  localStorage.setItem("pages", JSON.stringify(pages));
  localStorage.setItem("queue", JSON.stringify(queue));
}

/* SYNC */
async function sync(){

  try{

    let r = await fetch("/coins");
    let d = await r.json();
    coins = d.coins || 0;

    if(queue.coins !== 0){
      await fetch("/coins/sync", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({delta:queue.coins})
      });
      queue.coins = 0;
    }

    for(let p of queue.pages){
      await fetch("/page/save", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(p)
      });
    }

    queue.pages = [];

    save();

  }catch(e){
    console.log("offline");
  }

  document.getElementById("c").innerText = coins;
}

setInterval(sync, 7000);
sync();

/* BACK */
function back(){
  if(history.length <= 1) return;
  history.pop();
  openPage(history[history.length-1], false);
}

/* NAV */
function go(e){
  if(e.key === "Enter"){
    openPage(e.target.value);
  }
}

/* OPEN PAGE */
async function openPage(name, add=true){

  if(name === "new_page.orbit"){

    document.getElementById("view").innerHTML = `
      <h2>Neue Seite</h2>

      <input id="n" placeholder="name"><br><br>

      <input type="file" id="img"><br><br>

      <textarea id="t" style="width:100%;height:120px;"></textarea><br><br>

      <button onclick="create()">Save</button>
      <button onclick="back()">← Back</button>
    `;
    return;
  }

  let local = pages.find(p => p.name === name);
  let content = "";

  if(local){
    content = local.content;
  }else{
    try{
      let r = await fetch("/page/" + name);
      let d = await r.json();
      content = d.content;
    }catch(e){
      content = "OFFLINE";
    }
  }

  document.getElementById("view").innerHTML = content;

  if(add) history.push(name);
}

/* CREATE PAGE + IMAGE */
function create(){

  let name = document.getElementById("n").value;
  let text = document.getElementById("t").value;
  let file = document.getElementById("img").files[0];

  if(!file){

    savePage(name, text);
    return;
  }

  let reader = new FileReader();

  reader.onload = async function(){

    let res = await fetch("/upload/image", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ image: reader.result })
    });

    let data = await res.json();

    let html = `<img src="${data.url}" width="250"><br>${text}`;

    savePage(name, html);
  };

  reader.readAsDataURL(file);
}

/* SAVE PAGE */
function savePage(name, content){

  pages.push({name, content});
  queue.pages.push({name, content});

  save();

  openPage(name);
}

/* COIN PIN */
function coinPin(){

  let pin = prompt("PIN:");

  if(pin !== "081508151235180Rss#") return alert("wrong");

  let add = Number(prompt("coins:"));

  coins += add;
  queue.coins += add;

  save();

  document.getElementById("c").innerText = coins;
}

</script>

</body>
</html>
